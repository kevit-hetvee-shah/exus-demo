# CopyData: Addresses
# Copy aggregated address data to Address table

task:
  name: addresses
  description: "Copy aggregated address data to Address table"
  version: "1.0"

source:
  name: address
  type: aggregated_dataset

destination:
  table: Address
  database: systemA.db

record_join:
  source_columns: [CustomerId, Address]
  destination_columns: [CustomerId, Address]

copy_mode: insert_only

column_mappings:
  - source: CustomerId
    destination: CustomerId
    empty_source_behavior: update

  - source: Address
    destination: Address
    empty_source_behavior: update
