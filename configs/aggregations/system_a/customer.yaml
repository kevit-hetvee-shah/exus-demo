# Customer Aggregation
# Aggregates customer data to get one unique customer record

aggregation:
  name: customer
  description: "Aggregated customer data - one record per customer"
  version: "1.0"

source:
  name: source_file_a
  type: source_file  # source_file or union_dataset

group_by:
  - CustomerId

aggregated_columns:
  - name: CustomerName
    function: first  # first, last, min, max, count, sum, avg

  - name: CustomerVAT
    function: first
