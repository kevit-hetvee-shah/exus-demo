# Phone Table Schema
table:
  name: Phone
  description: "Customer phone numbers - one customer can have multiple phones"

columns:
  - name: PhoneId
    type: INTEGER
    primary_key: true
    nullable: false
    autoincrement: true

  - name: CustomerId
    type: INTEGER
    nullable: false
    foreign_key:
      table: Customer
      column: CustomerId

  - name: PhoneNumber
    type: TEXT
    nullable: true

indexes:
  - name: idx_phone_customer
    columns: [CustomerId]
    unique: false
