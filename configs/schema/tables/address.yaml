# Address Table Schema
table:
  name: Address
  description: "Customer addresses - one customer can have multiple addresses"

columns:
  - name: AddressId
    type: INTEGER
    primary_key: true
    nullable: false
    autoincrement: true

  - name: CustomerId
    type: INTEGER
    nullable: false
    foreign_key:
      table: Customer
      column: CustomerId

  - name: Address
    type: TEXT
    nullable: true

indexes:
  - name: idx_address_customer
    columns: [CustomerId]
    unique: false
